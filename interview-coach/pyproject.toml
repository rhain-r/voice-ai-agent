[project]
name = "interview-coach"
version = "0.1.0"
description = "Voice mock-interview coach built on LiveKit Agents, Claude, MCP and LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[anthropic,deepgram,silero,turn-detector,cartesia,mcp]==1.8.8",
    "livekit-api>=1.0",
    "mcp==2.3.0",
    "langgraph==1.2.16",
    "anthropic>=1.17",
    "fastapi>=0.161",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
coach-agent = "interview_coach.agent.worker:main"
coach-api = "interview_coach.api.main:run"
coach-mcp = "interview_coach.mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_coach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["eval: needs ANTHROPIC_API_KEY"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
